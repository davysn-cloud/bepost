services:
  # Backend API
  - type: web
    name: bepost-backend
    env: node
    region: oregon
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: bepost-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: FRONTEND_URL
        sync: false

databases:
  # PostgreSQL Database
  - name: bepost-db
    databaseName: bepost
    user: bepost
    region: oregon
